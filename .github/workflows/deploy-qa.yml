name: Deploy QA

on:
  push:
    branches:
      - qa

jobs:
  deploy-qa:
    runs-on: ubuntu-latest

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      QA_PATH: ${{ secrets.QA_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend env file
        run: |
          printf "%s\n" "${{ secrets.BACKEND_ENV_QA }}" > backend/.env

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Create QA folder on VM
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p $QA_PATH"

      - name: Sync project to QA
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "backend/.venv" \
            --exclude "frontend/node_modules" \
            --exclude "frontend/dist" \
            ./ "$VM_USER@$VM_HOST:$QA_PATH/"

      - name: Deploy QA with Docker Compose
        run: |
          ssh "$VM_USER@$VM_HOST" "
            cd $QA_PATH &&
            docker compose -f docker-compose.qa.yml up -d --build --remove-orphans &&
            docker image prune -f
          "